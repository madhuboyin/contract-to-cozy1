apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: production
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: production
spec:
  replicas: 5
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/madhuboyin/contract-to-cozy/backend:latest
          # `Always` ensures newly-created pods resolve the current digest.
          # Pushing this mutable tag still requires a rollout restart (or an
          # immutable image tag update) because apply alone does not recreate
          # an unchanged pod template.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Non-sensitive app-config keys are also imported so new
          # TOOL_ROLLOUT_* controls can be changed without editing this manifest.
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: API_PORT
            - name: DISABLE_EMAIL_VERIFICATION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DISABLE_EMAIL_VERIFICATION
            - name: ENFORCE_HUMAN_POLICY_APPROVALS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENFORCE_HUMAN_POLICY_APPROVALS
            # Worker execution policy (WKR-004) — see
            # apps/backend/src/config/workerExecutionPolicy.ts. The backend
            # (not just workers) needs these: the admin console's Worker
            # Jobs page runs evaluateWorkerExecution() against the
            # backend's own process.env to render enabled/disabled state
            # and to gate manual "Run Job" triggers, so it must see the
            # same flags workers actually runs under or the console lies.
            - name: WORKER_AUTOMATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_AUTOMATION_ENABLED
            - name: WORKER_OUTBOUND_NOTIFICATIONS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_OUTBOUND_NOTIFICATIONS_ENABLED
            - name: REFINANCE_EXTERNAL_ALERTS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REFINANCE_EXTERNAL_ALERTS_ENABLED
            - name: REFINANCE_ALERT_ROLLOUT_MODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REFINANCE_ALERT_ROLLOUT_MODE
            - name: REFINANCE_ALERT_RECIPIENT_EMAIL_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REFINANCE_ALERT_RECIPIENT_EMAIL_ALLOWLIST
                  optional: true
            - name: WEB_PUSH_DELIVERY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WEB_PUSH_DELIVERY_ENABLED
            - name: REFINANCE_PUSH_ALERTS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REFINANCE_PUSH_ALERTS_ENABLED
            - name: WEB_PUSH_VAPID_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WEB_PUSH_VAPID_PUBLIC_KEY
            - name: WORKER_EXTERNAL_INGEST_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_EXTERNAL_INGEST_ENABLED
            - name: WORKER_MUTATING_SWEEPS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_MUTATING_SWEEPS_ENABLED
            - name: WORKER_MANUAL_TRIGGERS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_MANUAL_TRIGGERS_ENABLED
            - name: ENFORCE_WORKER_MANUAL_TRIGGER_APPROVALS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENFORCE_WORKER_MANUAL_TRIGGER_APPROVALS
            - name: WORKER_JOB_HIDDEN_ASSET_REFRESH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_HIDDEN_ASSET_REFRESH_ENABLED
            - name: WORKER_JOB_HOME_HABIT_GENERATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_HOME_HABIT_GENERATION_ENABLED
            - name: WORKER_JOB_RESERVE_FUND_RECALCULATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_RESERVE_FUND_RECALCULATION_ENABLED
            - name: WORKER_JOB_PROVIDER_MISSING_CREDENTIAL_SWEEP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_PROVIDER_MISSING_CREDENTIAL_SWEEP_ENABLED
            - name: WORKER_JOB_INVENTORY_DRAFT_CLEANUP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_INVENTORY_DRAFT_CLEANUP_ENABLED
            - name: WORKER_JOB_REPORT_EXPORT_CLEANUP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_REPORT_EXPORT_CLEANUP_ENABLED
            - name: WORKER_JOB_MATERIAL_SPEC_EXPORT_CLEANUP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_MATERIAL_SPEC_EXPORT_CLEANUP_ENABLED
            - name: WORKER_JOB_SEASONAL_CHECKLIST_GENERATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_SEASONAL_CHECKLIST_GENERATION_ENABLED
            - name: WORKER_JOB_HOME_GAZETTE_GENERATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_HOME_GAZETTE_GENERATION_ENABLED
            - name: WORKER_JOB_FREEZE_RISK_INCIDENTS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_FREEZE_RISK_INCIDENTS_ENABLED
            - name: WORKER_JOB_SEVERE_WEATHER_ALERTS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_SEVERE_WEATHER_ALERTS_ENABLED
            - name: WORKER_JOB_AIRNOW_AIR_QUALITY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_AIRNOW_AIR_QUALITY_ENABLED
            - name: WORKER_JOB_USGS_EARTHQUAKES_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_USGS_EARTHQUAKES_ENABLED
            - name: WORKER_JOB_OPENFEMA_DECLARATIONS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_OPENFEMA_DECLARATIONS_ENABLED
            - name: WORKER_JOB_TAX_ASSESSMENT_INGEST_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_TAX_ASSESSMENT_INGEST_ENABLED
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_REFRESH_SECRET
            - name: JWT_EMAIL_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_EMAIL_SECRET
            - name: JWT_PASSWORD_RESET_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_PASSWORD_RESET_SECRET
            - name: JWT_MFA_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_MFA_SECRET
            - name: LOKI_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOKI_HOST
            - name: LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: loki-basic-auth
                  key: username
            - name: LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loki-basic-auth
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            - name: GEMINI_CHAT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: GEMINI_CHAT_ENABLED
            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: GEMINI_MODEL
            - name: ROOM_SCAN_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ROOM_SCAN_PROVIDER
            - name: ROOM_SCAN_GEMINI_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ROOM_SCAN_GEMINI_DEBUG
            - name: INVENTORY_ROOM_SCAN_AUTOSELECT_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: INVENTORY_ROOM_SCAN_AUTOSELECT_THRESHOLD
            - name: INVENTORY_ROOM_SCAN_STORE_AI_RAW
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: INVENTORY_ROOM_SCAN_STORE_AI_RAW
            - name: INVENTORY_ROOM_SCAN_DUPLICATE_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: INVENTORY_ROOM_SCAN_DUPLICATE_THRESHOLD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GEMINI_API_KEY
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_MAPS_API_KEY
                  optional: true
            - name: SWAGGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-docs-auth
                  key: SWAGGER_PASSWORD
            - name: METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: metrics-scrape-auth
                  key: METRICS_BEARER_TOKEN
            - name: TICKETMASTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: TICKETMASTER_API_KEY
            - name: TICKETMASTER_MAX_PAGES
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TICKETMASTER_MAX_PAGES
            - name: EVENTS_RADIUS_MILES
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: EVENTS_RADIUS_MILES
            - name: EVENTS_STALE_DAYS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: EVENTS_STALE_DAYS
            - name: HOME_EVENTS_AUTOGEN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: HOME_EVENTS_AUTOGEN
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-reports-secret
                  key: S3_BUCKET
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-reports-secret
                  key: S3_REGION
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-reports-secret
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-reports-secret
                  key: S3_SECRET_ACCESS_KEY
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ALLOWED_ORIGINS
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SENTRY_DSN_BACKEND
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CSRF_SECRET
            - name: MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MFA_ENCRYPTION_KEY
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: OPENWEATHER_API_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "800Mi"
            limits:
              cpu: "1000m"
              memory: "1200Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              # Keep an API image with an unloadable Prisma engine—or an API
              # pod that cannot reach PostgreSQL—out of the Service. Liveness
              # remains shallow so a database outage does not restart-loop
              # otherwise healthy application processes.
              path: /api/health/deep
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-deployment
  minReplicas: 5
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

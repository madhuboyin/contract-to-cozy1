apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/madhuboyin/contract-to-cozy/workers:latest
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            # WKR-005: propagate the same beta governance flag to workers
            # that the backend already reads — shared services imported by
            # the worker (NotificationService, etc.) must see the same mode.
            - name: ENFORCE_HUMAN_POLICY_APPROVALS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENFORCE_HUMAN_POLICY_APPROVALS
            # Worker execution policy (WKR-004) — see
            # apps/backend/src/config/workerExecutionPolicy.ts.
            - name: WORKER_AUTOMATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_AUTOMATION_ENABLED
            - name: WORKER_OUTBOUND_NOTIFICATIONS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_OUTBOUND_NOTIFICATIONS_ENABLED
            - name: REFINANCE_EXTERNAL_ALERTS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REFINANCE_EXTERNAL_ALERTS_ENABLED
            - name: REFINANCE_ALERT_ROLLOUT_MODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REFINANCE_ALERT_ROLLOUT_MODE
            - name: REFINANCE_ALERT_RECIPIENT_EMAIL_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REFINANCE_ALERT_RECIPIENT_EMAIL_ALLOWLIST
                  optional: true
            - name: WEB_PUSH_DELIVERY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WEB_PUSH_DELIVERY_ENABLED
            - name: REFINANCE_PUSH_ALERTS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REFINANCE_PUSH_ALERTS_ENABLED
            - name: WEB_PUSH_VAPID_SUBJECT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WEB_PUSH_VAPID_SUBJECT
            - name: WEB_PUSH_VAPID_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WEB_PUSH_VAPID_PUBLIC_KEY
            - name: WEB_PUSH_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: WEB_PUSH_VAPID_PRIVATE_KEY
                  optional: true
            - name: WORKER_EXTERNAL_INGEST_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_EXTERNAL_INGEST_ENABLED
            - name: WORKER_MUTATING_SWEEPS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_MUTATING_SWEEPS_ENABLED
            - name: WORKER_MANUAL_TRIGGERS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_MANUAL_TRIGGERS_ENABLED
            - name: ENFORCE_WORKER_MANUAL_TRIGGER_APPROVALS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENFORCE_WORKER_MANUAL_TRIGGER_APPROVALS
            # Per-job overrides for the 7 reviewed-clean jobs in the
            # WORKER_MUTATING_SWEEPS_ENABLED=false group (see configmap.yaml).
            - name: WORKER_JOB_HIDDEN_ASSET_REFRESH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_HIDDEN_ASSET_REFRESH_ENABLED
            - name: WORKER_JOB_HOME_HABIT_GENERATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_HOME_HABIT_GENERATION_ENABLED
            - name: WORKER_JOB_RESERVE_FUND_RECALCULATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_RESERVE_FUND_RECALCULATION_ENABLED
            - name: WORKER_JOB_PROVIDER_MISSING_CREDENTIAL_SWEEP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_PROVIDER_MISSING_CREDENTIAL_SWEEP_ENABLED
            - name: WORKER_JOB_INVENTORY_DRAFT_CLEANUP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_INVENTORY_DRAFT_CLEANUP_ENABLED
            - name: WORKER_JOB_REPORT_EXPORT_CLEANUP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_REPORT_EXPORT_CLEANUP_ENABLED
            - name: WORKER_JOB_MATERIAL_SPEC_EXPORT_CLEANUP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_MATERIAL_SPEC_EXPORT_CLEANUP_ENABLED
            - name: WORKER_JOB_SEASONAL_CHECKLIST_GENERATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_SEASONAL_CHECKLIST_GENERATION_ENABLED
            - name: WORKER_JOB_HOME_GAZETTE_GENERATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_HOME_GAZETTE_GENERATION_ENABLED
            - name: WORKER_JOB_FREEZE_RISK_INCIDENTS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_FREEZE_RISK_INCIDENTS_ENABLED
            - name: WORKER_JOB_SEVERE_WEATHER_ALERTS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_SEVERE_WEATHER_ALERTS_ENABLED
            - name: WORKER_JOB_AIRNOW_AIR_QUALITY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: WORKER_JOB_AIRNOW_AIR_QUALITY_ENABLED
            - name: AIRNOW_AIR_QUALITY_CRON
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AIRNOW_AIR_QUALITY_CRON
            - name: AIRNOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AIRNOW_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GEMINI_API_KEY
            - name: FRED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: FRED_API_KEY
            - name: TICKETMASTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: TICKETMASTER_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: LOKI_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOKI_HOST
            - name: LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: loki-basic-auth
                  key: username
            - name: LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loki-basic-auth
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            - name: TICKETMASTER_MAX_PAGES
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TICKETMASTER_MAX_PAGES
            - name: EVENTS_RADIUS_MILES
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: EVENTS_RADIUS_MILES
            - name: EVENTS_STALE_DAYS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: EVENTS_STALE_DAYS
            - name: EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: EMAIL_FROM
            - name: RETENTION_REPORT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: RETENTION_REPORT_EMAIL
            - name: CPSC_RECALL_FEED_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CPSC_RECALL_FEED_URL
            - name: NWS_USER_AGENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NWS_USER_AGENT
            - name: RADAR_DUMMY_INGEST_ENABLED
              value: "false"
            - name: RADAR_DUMMY_INGEST_CRON
              value: "*/30 * * * *"
            - name: RADAR_DUMMY_INGEST_RUN_ON_STARTUP
              value: "false"
            - name: RADAR_DUMMY_FIXTURE_SET
              value: "zip_scoped"
            - name: RADAR_DUMMY_TARGET_ZIPS
              value: "08536,10019"
            - name: HOME_RISK_REPLAY_DUMMY_INGEST_ENABLED
              value: "false"
            - name: HOME_RISK_REPLAY_DUMMY_INGEST_CRON
              value: "15 */6 * * *"
            - name: HOME_RISK_REPLAY_DUMMY_INGEST_RUN_ON_STARTUP
              value: "false"
            - name: HOME_RISK_REPLAY_DUMMY_FIXTURE_SET
              value: "zip_scoped"
            - name: HOME_RISK_REPLAY_DUMMY_TARGET_ZIPS
              value: "08536,10019"
            - name: NEIGHBORHOOD_DUMMY_INGEST_ENABLED
              value: "false"
            - name: NEIGHBORHOOD_DUMMY_INGEST_CRON
              value: "45 */6 * * *"
            - name: NEIGHBORHOOD_DUMMY_INGEST_RUN_ON_STARTUP
              value: "false"
            - name: NEIGHBORHOOD_DUMMY_FIXTURE_SET
              value: "zip_scoped"
            - name: NEIGHBORHOOD_DUMMY_TARGET_ZIPS
              value: "08536,10019"
            - name: NEIGHBORHOOD_REFRESH_ENABLED
              value: "true"
            - name: SMTP_HOST
              value: smtp-relay.brevo.com
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: brevo-secrets
                  key: SMTP_PASS
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-reports-secret
                  key: S3_BUCKET
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-reports-secret
                  key: S3_REGION
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-reports-secret
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-reports-secret
                  key: S3_SECRET_ACCESS_KEY
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  # Application
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  
  # API Configuration
  API_PORT: "8080"
  API_HOST: "0.0.0.0"
  
  # Frontend Configuration
  NEXT_PUBLIC_API_URL: "https://api.contracttocozy.com"
  NEXT_PUBLIC_FARO_URL: "/api/faro/collect"

  # CORS — comma-separated list of origins the backend will accept requests from.
  # Add staging/preview domains here as needed.
  ALLOWED_ORIGINS: "https://contracttocozy.com,https://www.contracttocozy.com,https://docs.contracttocozy.com"

  # Gemini / AI
  GEMINI_CHAT_ENABLED: "true"
  GEMINI_MODEL: "gemini-2.0-flash"

  # Room scan
  ROOM_SCAN_PROVIDER: "gemini"
  ROOM_SCAN_GEMINI_DEBUG: "false"
  INVENTORY_ROOM_SCAN_AUTOSELECT_THRESHOLD: "0.72"
  INVENTORY_ROOM_SCAN_STORE_AI_RAW: "false"
  INVENTORY_ROOM_SCAN_DUPLICATE_THRESHOLD: "0.92"

  # Community events (workers)
  TICKETMASTER_MAX_PAGES: "3"
  EVENTS_RADIUS_MILES: "15"
  EVENTS_STALE_DAYS: "2"

  # Home events auto-generation
  HOME_EVENTS_AUTOGEN: "true"

  # Database Configuration (non-sensitive)
  DB_HOST: "postgres.production.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "contracttocozy"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  
  # Loki (pino-loki direct push)
  LOKI_HOST: "http://loki-gateway.monitoring.svc.cluster.local"

  # Redis Configuration
  REDIS_HOST: "redis.production.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # Application Features
  ENABLE_SIGNUP: "true"
  ENABLE_REVIEWS: "true"
  ENABLE_CHAT: "true"
  # Pilot-only authentication switch. Set to "false" before general availability.
  DISABLE_EMAIL_VERIFICATION: "true"
  # No external users are admitted yet. Enable only with current human
  # attestations when an explicit real-user launch is approved.
  ENFORCE_HUMAN_POLICY_APPROVALS: "false"
  # Keep the deployed pilot in internal beta until launch-owner sign-off.
  TOOL_DISCOVERY_RELEASE_MODE: "INTERNAL_BETA"
  TOOL_DISCOVERY_ENABLED: "true"
  CAPABILITY_RECOMMENDATIONS_ENABLED: "true"
  ENFORCE_TOOL_DISCOVERY_RELEASE_GATES: "true"
  TOOL_DISCOVERY_DISABLED_IDS: ""
  # Runtime containment lists. Values are comma-separated canonical
  # capability IDs; keep the complete intended list when changing one.
  TOOL_DISCOVERY_BROKEN_ROUTE_IDS: ""
  TOOL_DISCOVERY_RELEASE_GATE_BLOCKED_IDS: ""
  # Deployment/rollback guards. The registry hash may remain blank until an
  # immutable release pins it. Manifest pins use capability-id:version pairs.
  TOOL_DISCOVERY_EXPECTED_REGISTRY_VERSION: ""
  TOOL_DISCOVERY_MANIFEST_VERSIONS: ""

  # Worker execution policy (apps/backend/src/config/workerExecutionPolicy.ts).
  # Beta defaults per the worker module audit — flip a flag to "true" only
  # after reviewing that job group for this single shared environment.
  # Per-job overrides: WORKER_JOB_<NORMALIZED_KEY>_ENABLED=true|false.
  WORKER_AUTOMATION_ENABLED: "true"
  # Synced from live 2026-07-24 — was hand-set to "true" directly on the
  # cluster via Rancher, never reflected here. Adopting live as the
  # baseline since there's no record of why; revisit if this should be
  # reviewed as a fresh group-flag decision rather than grandfathered in.
  WORKER_OUTBOUND_NOTIFICATIONS_ENABLED: "true"
  REFINANCE_EXTERNAL_ALERTS_ENABLED: "false"
  # Keep cohort rollout fail-closed. Recipient emails belong in app-secrets as
  # REFINANCE_ALERT_RECIPIENT_EMAIL_ALLOWLIST, never in this ConfigMap.
  REFINANCE_ALERT_ROLLOUT_MODE: "ALLOWLIST"
  # Web Push remains off until an internal cohort and VAPID configuration are
  # approved. WEB_PUSH_VAPID_PRIVATE_KEY belongs in app-secrets, not here.
  WEB_PUSH_DELIVERY_ENABLED: "false"
  REFINANCE_PUSH_ALERTS_ENABLED: "false"
  WEB_PUSH_VAPID_SUBJECT: ""
  WEB_PUSH_VAPID_PUBLIC_KEY: ""
  # Deliberately kept "false" (not synced from live's "true") — the
  # WORKER_JOB_FREEZE_RISK_INCIDENTS_ENABLED / WORKER_JOB_SEVERE_WEATHER_ALERTS_ENABLED
  # per-job overrides below replace the group flag for those two jobs so
  # the other external-ingest jobs (recall-ingest, mortgage-rate-ingest,
  # permit-fetch, generate-diy-ai-guide, etc.) stay off pending review.
  WORKER_EXTERNAL_INGEST_ENABLED: "false"
  # Durable canonical Radar ingestion. This is independent from provider
  # enablement so reviewed NWS/freeze jobs can share one bounded consumer.
  RADAR_INGEST_ENABLED: "true"
  RADAR_INGEST_CONCURRENCY: "4"
  WORKER_MUTATING_SWEEPS_ENABLED: "false"
  WORKER_MANUAL_TRIGGERS_ENABLED: "true"
  # Synced from live 2026-07-24 (was "false" here, "true" on the cluster).
  # This blocks every HIGH_IMPACT_MANUAL job's manual trigger while no
  # approval workflow exists (see workerExecutionPolicy.ts) — confirm this
  # is still intended next time a HIGH_IMPACT_MANUAL job needs a manual run.
  ENFORCE_WORKER_MANUAL_TRIGGER_APPROVALS: "true"
  # Per-job overrides for the WORKER_MUTATING_SWEEPS_ENABLED=false group —
  # reviewed individually (correct propertyId scoping, dry-run behavior,
  # per-item error isolation, narrow write/delete scope) and enabled ahead
  # of the rest of the group. shared-data-backfill stays off — its
  # propertyId-forwarding bug is fixed, but defaultEnabledInBeta:false is a
  # deliberate WKR-011 product decision (this single-environment operating
  # model has no real-user migration/backfill need), not a code-safety gap,
  # and a per-job override would bypass that the same way the group flag
  # would.
  WORKER_JOB_HIDDEN_ASSET_REFRESH_ENABLED: "true"
  WORKER_JOB_HOME_HABIT_GENERATION_ENABLED: "true"
  WORKER_JOB_RESERVE_FUND_RECALCULATION_ENABLED: "true"
  WORKER_JOB_PROVIDER_MISSING_CREDENTIAL_SWEEP_ENABLED: "true"
  WORKER_JOB_INVENTORY_DRAFT_CLEANUP_ENABLED: "true"
  WORKER_JOB_REPORT_EXPORT_CLEANUP_ENABLED: "true"
  WORKER_JOB_MATERIAL_SPEC_EXPORT_CLEANUP_ENABLED: "true"
  WORKER_JOB_SEASONAL_CHECKLIST_GENERATION_ENABLED: "true"
  WORKER_JOB_HOME_GAZETTE_GENERATION_ENABLED: "true"
  # Per-job overrides for the WORKER_EXTERNAL_INGEST_ENABLED=false group —
  # reviewed individually rather than flipping the group flag, which would
  # also enable every other external-provider job (recall-ingest,
  # neighborhood-radar-refresh, mortgage-rate-ingest, tax-assessment-ingest,
  # permit-fetch, generate-diy-ai-guide) without review.
  WORKER_JOB_FREEZE_RISK_INCIDENTS_ENABLED: "true"
  WORKER_JOB_SEVERE_WEATHER_ALERTS_ENABLED: "true"

  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  
  # Session Configuration
  SESSION_TIMEOUT_MINUTES: "60"
  
  # Email Configuration (non-sensitive)
  EMAIL_FROM: "noreply@contracttocozy.com"
  EMAIL_REPLY_TO: "support@contracttocozy.com"

  # Severe weather alerts (NOAA/NWS, api.weather.gov) — identifying User-Agent
  # required by NWS API usage policy; not a secret.
  NWS_USER_AGENT: "(contracttocozy.com, ops@contracttocozy.com)"

  # Weekly retention/activation report recipient (see workers weeklyRetentionReport.job.ts)
  RETENTION_REPORT_EMAIL: "madhuboyina@gmail.com"

  # --- Synced from live 2026-07-24 — existed on the cluster (via Rancher)
  # but were never tracked in this file. Values below are copied as-is
  # from the live ConfigMap; confirm each is still correct/needed.
  CPSC_RECALL_FEED_URL: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallDateStart=2025-01-01"
  EVENTBRITE_MAX_PAGES: "5"
  SMTP_USER: "9ec830001@smtp-brevo.com"
  VAULT_BYPASS_PASSWORD: "true"
  PREVIEW_KEY: "contract2cozy2025"
  NEXT_PUBLIC_PREVIEW_KEY: "contract2cozy2025"

name: Frontend Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gates:
    name: Route QA + Governance Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: QA + Governance Gates
        run: npm run qa:gates

      - name: Home Digital Twin frontend contract
        run: npx jest src/__tests__/home-digital-twin-accessibility-contract.test.ts --runInBand

      - name: Install capability acceptance browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Capability discovery browser and PWA acceptance
        run: npm run test:tool-discovery:e2e

      - name: Home Digital Twin desktop and mobile acceptance
        run: npm run test:home-digital-twin:e2e

      - name: Ownership Cost accessibility and responsive acceptance
        run: npm run test:ownership-cost:e2e

      - name: Savings and Benefits accessibility, responsive, and partner-governance acceptance
        run: npm run test:savings-benefits:e2e

      - name: Service Quote Decision safety and accessibility acceptance
        run: npm run test:service-quote-decision:e2e

      - name: Upload Ownership Cost target-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownership-cost-target-build-evidence
          path: apps/frontend/test-results/ownership-cost-evidence.json
          if-no-files-found: error

      - name: Upload Savings and Benefits target-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: savings-benefits-target-build-evidence
          path: apps/frontend/test-results/savings-benefits-evidence.json
          if-no-files-found: error

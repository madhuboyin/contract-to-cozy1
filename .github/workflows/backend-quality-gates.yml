name: Backend Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/madhuboyin/contract-to-cozy/backend

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-smoke:
    name: Backend Integration Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_to_cozy_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contract_to_cozy_acceptance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contract_to_cozy_acceptance
      SAVINGS_BENEFITS_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/contract_to_cozy_acceptance
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend deps
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Rehearse additive closure migrations
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres contract_to_cozy_migration_rehearsal
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d contract_to_cozy_migration_rehearsal -f tests/fixtures/savings-benefits-pre-closure-schema.sql
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d contract_to_cozy_migration_rehearsal -f prisma/migrations/20260729170000_add_savings_editorial_separation/migration.sql
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d contract_to_cozy_migration_rehearsal -f prisma/migrations/20260729183000_complete_savings_closure/migration.sql
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d contract_to_cozy_migration_rehearsal -f tests/fixtures/verify-savings-benefits-closure-migrations.sql

      - name: Enable PostGIS in acceptance database
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d contract_to_cozy_acceptance -c 'CREATE EXTENSION IF NOT EXISTS postgis'

      # The historical repository migration set predates the current baseline
      # schema and cannot bootstrap an empty database by itself. db push is the
      # explicit clean-schema rehearsal used by this acceptance job; production
      # migration deployment remains a separate release operation.
      - name: Apply owner schema to clean acceptance database
        run: npx prisma db push --skip-generate --schema=./prisma/schema.prisma

      - name: Unit tests
        run: npm run test:unit

      - name: Ask governance, golden routing, and negative boundaries
        run: npm run test:ask

      - name: Integration smoke
        run: npm run test:integration

      # Exercise the exact production packaging path. The Dockerfile validates
      # Prisma's native query engine, schema WASM, cross-stage checksum, and
      # bundled schema before the image can be published.
      - name: Backend Docker image packaging
        run: docker build --target runner -f ../../infrastructure/docker/backend/Dockerfile .

  publish-backend-arm64:
    name: Publish backend ARM64 image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish verified backend image
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          file: infrastructure/docker/backend/Dockerfile
          target: runner
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

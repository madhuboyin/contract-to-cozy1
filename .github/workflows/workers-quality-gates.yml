name: Workers Quality Gates

# W4 item 5 (worker audit): apps/workers previously had zero CI coverage —
# security.yml's audit-workers job only ran `npm audit`, never the test
# suite, and no workflow ever built infrastructure/docker/workers/Dockerfile.
# Every prior worker-module-audit slice that touched a workers-side or
# Dockerfile-copied backend import had to validate the Docker build
# manually (local Docker daemon has been unavailable across this project's
# entire session history) — this job makes that validation continuous
# instead of a manual, easy-to-skip step.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  WORKERS_IMAGE: ghcr.io/madhuboyin/contract-to-cozy/workers

concurrency:
  group: workers-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Workers Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      # Workers' Prisma client is generated from the backend schema and
      # copied in manually (see apps/workers/package.json's postinstall) —
      # replicated explicitly here since --ignore-scripts skips postinstall.
      - name: Install backend deps
        working-directory: apps/backend
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        working-directory: apps/backend
        run: npm run prisma:generate

      - name: Install workers deps
        working-directory: apps/workers
        run: npm ci --ignore-scripts

      - name: Copy Prisma client into workers node_modules
        working-directory: apps/workers
        run: |
          cp -r ../backend/node_modules/@prisma/client node_modules/
          mkdir -p node_modules/.prisma
          cp -r ../backend/node_modules/.prisma/client node_modules/.prisma/

      - name: Unit tests
        working-directory: apps/workers
        run: npm test

      - name: Notification delivery boundary
        working-directory: apps/workers
        run: npm run lint:notification-boundary

      - name: Worker-safe import boundary
        working-directory: apps/workers
        run: npm run lint:worker-import-boundary

  docker-build:
    name: Workers Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build context is the repo root — the Dockerfile's own COPY
      # instructions (COPY apps/workers/package*.json, COPY apps/backend/src/...)
      # are only valid relative to the repo root, not apps/workers/ itself.
      - name: Build workers image
        run: docker build -f infrastructure/docker/workers/Dockerfile .

  publish-workers-arm64:
    name: Publish workers ARM64 image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The full worker suite remains a required, independently visible quality
    # signal. Publication follows the production Docker build so unrelated
    # historical unit failures do not leave the cluster on a stale worker image.
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish production workers image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/workers/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.WORKERS_IMAGE }}:latest-arm64
            ${{ env.WORKERS_IMAGE }}:${{ github.sha }}-arm64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

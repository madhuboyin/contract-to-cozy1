name: Documentation library quality gates

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-library-quality-gates.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-library-quality-gates.yml'

permissions:
  contents: read

jobs:
  validate-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generated artifacts and requirement evidence
        run: python3 docs/library/tools/check_library.py

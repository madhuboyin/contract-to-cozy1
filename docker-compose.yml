version: '3.9'

# ============================================================================
# SECRETS — never hardcode values here.
# Copy .env.local.example → .env.local, fill in values, then run:
#   docker compose --env-file .env.local up
# ============================================================================

services:
  postgres:
    # PostGIS-enabled Alpine build (multi-arch); required for Home Event
    # Radar geography columns. On an existing volume run once:
    #   CREATE EXTENSION IF NOT EXISTS postgis;
    image: imresamu/postgis:15-3.4-alpine
    container_name: contracttocozy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: contracttocozy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contracttocozy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../infrastructure/docker/backend/Dockerfile
      target: builder
    container_name: contracttocozy-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/contracttocozy
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EMAIL_SECRET: ${JWT_EMAIL_SECRET}
      JWT_PASSWORD_RESET_SECRET: ${JWT_PASSWORD_RESET_SECRET}
      JWT_MFA_SECRET: ${JWT_MFA_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
      ENFORCE_HUMAN_POLICY_APPROVALS: ${ENFORCE_HUMAN_POLICY_APPROVALS:-false}
      # Capability discovery operational controls. Keep defaults aligned with
      # launch behavior unless local internal-beta behavior is explicitly used.
      TOOL_DISCOVERY_RELEASE_MODE: ${TOOL_DISCOVERY_RELEASE_MODE:-INTERNAL_BETA}
      TOOL_DISCOVERY_ENABLED: ${TOOL_DISCOVERY_ENABLED:-true}
      CAPABILITY_RECOMMENDATIONS_ENABLED: ${CAPABILITY_RECOMMENDATIONS_ENABLED:-true}
      ENFORCE_TOOL_DISCOVERY_RELEASE_GATES: ${ENFORCE_TOOL_DISCOVERY_RELEASE_GATES:-false}
      TOOL_DISCOVERY_DISABLED_IDS: ${TOOL_DISCOVERY_DISABLED_IDS:-}
      TOOL_DISCOVERY_BROKEN_ROUTE_IDS: ${TOOL_DISCOVERY_BROKEN_ROUTE_IDS:-}
      TOOL_DISCOVERY_RELEASE_GATE_BLOCKED_IDS: ${TOOL_DISCOVERY_RELEASE_GATE_BLOCKED_IDS:-}
      TOOL_DISCOVERY_EXPECTED_REGISTRY_VERSION: ${TOOL_DISCOVERY_EXPECTED_REGISTRY_VERSION:-}
      TOOL_DISCOVERY_MANIFEST_VERSIONS: ${TOOL_DISCOVERY_MANIFEST_VERSIONS:-}
      # Worker execution policy (see apps/backend/src/config/workerExecutionPolicy.ts).
      # The backend needs these too: the admin console's Worker Jobs page
      # evaluates job enabled/disabled state against the backend's own
      # process.env, not the workers container's.
      WORKER_AUTOMATION_ENABLED: ${WORKER_AUTOMATION_ENABLED:-true}
      WORKER_OUTBOUND_NOTIFICATIONS_ENABLED: ${WORKER_OUTBOUND_NOTIFICATIONS_ENABLED:-false}
      REFINANCE_EXTERNAL_ALERTS_ENABLED: ${REFINANCE_EXTERNAL_ALERTS_ENABLED:-false}
      REFINANCE_ALERT_ROLLOUT_MODE: ${REFINANCE_ALERT_ROLLOUT_MODE:-ALLOWLIST}
      REFINANCE_ALERT_RECIPIENT_EMAIL_ALLOWLIST: ${REFINANCE_ALERT_RECIPIENT_EMAIL_ALLOWLIST:-}
      WEB_PUSH_DELIVERY_ENABLED: ${WEB_PUSH_DELIVERY_ENABLED:-false}
      REFINANCE_PUSH_ALERTS_ENABLED: ${REFINANCE_PUSH_ALERTS_ENABLED:-false}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WORKER_EXTERNAL_INGEST_ENABLED: ${WORKER_EXTERNAL_INGEST_ENABLED:-false}
      RADAR_INGEST_ENABLED: ${RADAR_INGEST_ENABLED:-true}
      RADAR_INGEST_CONCURRENCY: ${RADAR_INGEST_CONCURRENCY:-4}
      RADAR_MATCH_ENABLED: ${RADAR_MATCH_ENABLED:-true}
      RADAR_MATCH_CONCURRENCY: ${RADAR_MATCH_CONCURRENCY:-8}
      RADAR_MATCH_PAGE_SIZE: ${RADAR_MATCH_PAGE_SIZE:-100}
      WORKER_MUTATING_SWEEPS_ENABLED: ${WORKER_MUTATING_SWEEPS_ENABLED:-false}
      WORKER_MANUAL_TRIGGERS_ENABLED: ${WORKER_MANUAL_TRIGGERS_ENABLED:-true}
      ENFORCE_WORKER_MANUAL_TRIGGER_APPROVALS: ${ENFORCE_WORKER_MANUAL_TRIGGER_APPROVALS:-false}
      WORKER_JOB_HIDDEN_ASSET_REFRESH_ENABLED: ${WORKER_JOB_HIDDEN_ASSET_REFRESH_ENABLED:-true}
      WORKER_JOB_HOME_HABIT_GENERATION_ENABLED: ${WORKER_JOB_HOME_HABIT_GENERATION_ENABLED:-true}
      WORKER_JOB_RESERVE_FUND_RECALCULATION_ENABLED: ${WORKER_JOB_RESERVE_FUND_RECALCULATION_ENABLED:-true}
      WORKER_JOB_PROVIDER_MISSING_CREDENTIAL_SWEEP_ENABLED: ${WORKER_JOB_PROVIDER_MISSING_CREDENTIAL_SWEEP_ENABLED:-true}
      WORKER_JOB_INVENTORY_DRAFT_CLEANUP_ENABLED: ${WORKER_JOB_INVENTORY_DRAFT_CLEANUP_ENABLED:-true}
      WORKER_JOB_REPORT_EXPORT_CLEANUP_ENABLED: ${WORKER_JOB_REPORT_EXPORT_CLEANUP_ENABLED:-true}
      WORKER_JOB_MATERIAL_SPEC_EXPORT_CLEANUP_ENABLED: ${WORKER_JOB_MATERIAL_SPEC_EXPORT_CLEANUP_ENABLED:-true}
      WORKER_JOB_SEASONAL_CHECKLIST_GENERATION_ENABLED: ${WORKER_JOB_SEASONAL_CHECKLIST_GENERATION_ENABLED:-true}
      WORKER_JOB_HOME_BRIEFING_DELIVERY_ENABLED: ${WORKER_JOB_HOME_BRIEFING_DELIVERY_ENABLED:-true}
      WORKER_JOB_RADAR_SAFETY_NET_RECONCILIATION_ENABLED: ${WORKER_JOB_RADAR_SAFETY_NET_RECONCILIATION_ENABLED:-true}
      WORKER_JOB_RENOVATION_ADVISOR_SESSION_EXPIRY_ENABLED: ${WORKER_JOB_RENOVATION_ADVISOR_SESSION_EXPIRY_ENABLED:-true}
      WORKER_JOB_SAVINGS_BENEFITS_SOURCE_HEALTH_AUDIT_ENABLED: ${WORKER_JOB_SAVINGS_BENEFITS_SOURCE_HEALTH_AUDIT_ENABLED:-true}
      WORKER_JOB_NYC_ZAP_PLANNING_INGEST_ENABLED: ${WORKER_JOB_NYC_ZAP_PLANNING_INGEST_ENABLED:-false}
      NYC_ZAP_PILOT_ENABLED: ${NYC_ZAP_PILOT_ENABLED:-false}
      NYC_ZAP_PILOT_COUNTIES: ${NYC_ZAP_PILOT_COUNTIES:-NEW YORK COUNTY}
      NYC_ZAP_PILOT_REVIEWED_BY: ${NYC_ZAP_PILOT_REVIEWED_BY:-}
      NYC_ZAP_PILOT_REVIEW_REFERENCE: ${NYC_ZAP_PILOT_REVIEW_REFERENCE:-}
      NYC_ZAP_PLANNING_INGEST_CRON: ${NYC_ZAP_PLANNING_INGEST_CRON:-35 3 * * *}
      WORKER_JOB_FREEZE_RISK_INCIDENTS_ENABLED: ${WORKER_JOB_FREEZE_RISK_INCIDENTS_ENABLED:-true}
      WORKER_JOB_SEVERE_WEATHER_ALERTS_ENABLED: ${WORKER_JOB_SEVERE_WEATHER_ALERTS_ENABLED:-true}
      # These two gate a SEPARATE inner policy check inside the job handler
      # (radarSourceRun.service.ts), keyed by RadarSourceDefinition.key rather
      # than the JOB_REGISTRY key above — see configmap.yaml comment.
      WORKER_JOB_NWS_ACTIVE_ALERTS_ENABLED: ${WORKER_JOB_NWS_ACTIVE_ALERTS_ENABLED:-true}
      WORKER_JOB_OPEN_METEO_FREEZE_FORECAST_ENABLED: ${WORKER_JOB_OPEN_METEO_FREEZE_FORECAST_ENABLED:-true}
      WORKER_JOB_RECALL_INGEST_ENABLED: ${WORKER_JOB_RECALL_INGEST_ENABLED:-true}
      WORKER_JOB_NEIGHBORHOOD_RADAR_REFRESH_ENABLED: ${WORKER_JOB_NEIGHBORHOOD_RADAR_REFRESH_ENABLED:-true}
      WORKER_JOB_MORTGAGE_RATE_INGEST_ENABLED: ${WORKER_JOB_MORTGAGE_RATE_INGEST_ENABLED:-true}
      WORKER_JOB_PERMIT_FETCH_ENABLED: ${WORKER_JOB_PERMIT_FETCH_ENABLED:-true}
      WORKER_JOB_GENERATE_DIY_AI_GUIDE_ENABLED: ${WORKER_JOB_GENERATE_DIY_AI_GUIDE_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../infrastructure/docker/frontend/Dockerfile
      target: builder
    container_name: contracttocozy-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_FEATURE_FEEDBACK_WIDGET: "true"
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  workers:
    build:
      context: ./apps/workers
      dockerfile: ../../infrastructure/docker/workers/Dockerfile
    container_name: contracttocozy-workers
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/contracttocozy
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENFORCE_HUMAN_POLICY_APPROVALS: ${ENFORCE_HUMAN_POLICY_APPROVALS:-false}
      # Worker execution policy (see apps/backend/src/config/workerExecutionPolicy.ts).
      # Beta defaults — flip to "true" once a job group has been reviewed for this environment.
      WORKER_AUTOMATION_ENABLED: ${WORKER_AUTOMATION_ENABLED:-true}
      WORKER_OUTBOUND_NOTIFICATIONS_ENABLED: ${WORKER_OUTBOUND_NOTIFICATIONS_ENABLED:-false}
      REFINANCE_EXTERNAL_ALERTS_ENABLED: ${REFINANCE_EXTERNAL_ALERTS_ENABLED:-false}
      REFINANCE_ALERT_ROLLOUT_MODE: ${REFINANCE_ALERT_ROLLOUT_MODE:-ALLOWLIST}
      REFINANCE_ALERT_RECIPIENT_EMAIL_ALLOWLIST: ${REFINANCE_ALERT_RECIPIENT_EMAIL_ALLOWLIST:-}
      WEB_PUSH_DELIVERY_ENABLED: ${WEB_PUSH_DELIVERY_ENABLED:-false}
      REFINANCE_PUSH_ALERTS_ENABLED: ${REFINANCE_PUSH_ALERTS_ENABLED:-false}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WORKER_EXTERNAL_INGEST_ENABLED: ${WORKER_EXTERNAL_INGEST_ENABLED:-false}
      RADAR_INGEST_ENABLED: ${RADAR_INGEST_ENABLED:-true}
      RADAR_INGEST_CONCURRENCY: ${RADAR_INGEST_CONCURRENCY:-4}
      RADAR_MATCH_ENABLED: ${RADAR_MATCH_ENABLED:-true}
      RADAR_MATCH_CONCURRENCY: ${RADAR_MATCH_CONCURRENCY:-8}
      RADAR_MATCH_PAGE_SIZE: ${RADAR_MATCH_PAGE_SIZE:-100}
      WORKER_MUTATING_SWEEPS_ENABLED: ${WORKER_MUTATING_SWEEPS_ENABLED:-false}
      WORKER_MANUAL_TRIGGERS_ENABLED: ${WORKER_MANUAL_TRIGGERS_ENABLED:-true}
      ENFORCE_WORKER_MANUAL_TRIGGER_APPROVALS: ${ENFORCE_WORKER_MANUAL_TRIGGER_APPROVALS:-false}
      # Per-job overrides for the 7 reviewed-clean jobs in the
      # WORKER_MUTATING_SWEEPS_ENABLED=false group (see configmap.yaml).
      WORKER_JOB_HIDDEN_ASSET_REFRESH_ENABLED: ${WORKER_JOB_HIDDEN_ASSET_REFRESH_ENABLED:-true}
      WORKER_JOB_HOME_HABIT_GENERATION_ENABLED: ${WORKER_JOB_HOME_HABIT_GENERATION_ENABLED:-true}
      WORKER_JOB_RESERVE_FUND_RECALCULATION_ENABLED: ${WORKER_JOB_RESERVE_FUND_RECALCULATION_ENABLED:-true}
      WORKER_JOB_PROVIDER_MISSING_CREDENTIAL_SWEEP_ENABLED: ${WORKER_JOB_PROVIDER_MISSING_CREDENTIAL_SWEEP_ENABLED:-true}
      WORKER_JOB_INVENTORY_DRAFT_CLEANUP_ENABLED: ${WORKER_JOB_INVENTORY_DRAFT_CLEANUP_ENABLED:-true}
      WORKER_JOB_REPORT_EXPORT_CLEANUP_ENABLED: ${WORKER_JOB_REPORT_EXPORT_CLEANUP_ENABLED:-true}
      WORKER_JOB_MATERIAL_SPEC_EXPORT_CLEANUP_ENABLED: ${WORKER_JOB_MATERIAL_SPEC_EXPORT_CLEANUP_ENABLED:-true}
      WORKER_JOB_SEASONAL_CHECKLIST_GENERATION_ENABLED: ${WORKER_JOB_SEASONAL_CHECKLIST_GENERATION_ENABLED:-true}
      WORKER_JOB_HOME_BRIEFING_DELIVERY_ENABLED: ${WORKER_JOB_HOME_BRIEFING_DELIVERY_ENABLED:-true}
      WORKER_JOB_RADAR_SAFETY_NET_RECONCILIATION_ENABLED: ${WORKER_JOB_RADAR_SAFETY_NET_RECONCILIATION_ENABLED:-true}
      WORKER_JOB_RENOVATION_ADVISOR_SESSION_EXPIRY_ENABLED: ${WORKER_JOB_RENOVATION_ADVISOR_SESSION_EXPIRY_ENABLED:-true}
      WORKER_JOB_SAVINGS_BENEFITS_SOURCE_HEALTH_AUDIT_ENABLED: ${WORKER_JOB_SAVINGS_BENEFITS_SOURCE_HEALTH_AUDIT_ENABLED:-true}
      WORKER_JOB_NYC_ZAP_PLANNING_INGEST_ENABLED: ${WORKER_JOB_NYC_ZAP_PLANNING_INGEST_ENABLED:-false}
      NYC_ZAP_PILOT_ENABLED: ${NYC_ZAP_PILOT_ENABLED:-false}
      NYC_ZAP_PILOT_COUNTIES: ${NYC_ZAP_PILOT_COUNTIES:-NEW YORK COUNTY}
      NYC_ZAP_PILOT_REVIEWED_BY: ${NYC_ZAP_PILOT_REVIEWED_BY:-}
      NYC_ZAP_PILOT_REVIEW_REFERENCE: ${NYC_ZAP_PILOT_REVIEW_REFERENCE:-}
      NYC_ZAP_PLANNING_INGEST_CRON: ${NYC_ZAP_PLANNING_INGEST_CRON:-35 3 * * *}
      NYC_OPEN_DATA_APP_TOKEN: ${NYC_OPEN_DATA_APP_TOKEN:-}
      # Per-job overrides for the WORKER_EXTERNAL_INGEST_ENABLED=false group
      # (see configmap.yaml) — reviewed individually rather than flipping
      # the group flag, which would also enable airnow-air-quality,
      # openfema-declarations, and tax-assessment-ingest without their
      # required review/credentials.
      WORKER_JOB_FREEZE_RISK_INCIDENTS_ENABLED: ${WORKER_JOB_FREEZE_RISK_INCIDENTS_ENABLED:-true}
      WORKER_JOB_SEVERE_WEATHER_ALERTS_ENABLED: ${WORKER_JOB_SEVERE_WEATHER_ALERTS_ENABLED:-true}
      # These two gate a SEPARATE inner policy check inside the job handler
      # (radarSourceRun.service.ts), keyed by RadarSourceDefinition.key rather
      # than the JOB_REGISTRY key above — see configmap.yaml comment.
      WORKER_JOB_NWS_ACTIVE_ALERTS_ENABLED: ${WORKER_JOB_NWS_ACTIVE_ALERTS_ENABLED:-true}
      WORKER_JOB_OPEN_METEO_FREEZE_FORECAST_ENABLED: ${WORKER_JOB_OPEN_METEO_FREEZE_FORECAST_ENABLED:-true}
      WORKER_JOB_RECALL_INGEST_ENABLED: ${WORKER_JOB_RECALL_INGEST_ENABLED:-true}
      WORKER_JOB_NEIGHBORHOOD_RADAR_REFRESH_ENABLED: ${WORKER_JOB_NEIGHBORHOOD_RADAR_REFRESH_ENABLED:-true}
      WORKER_JOB_MORTGAGE_RATE_INGEST_ENABLED: ${WORKER_JOB_MORTGAGE_RATE_INGEST_ENABLED:-true}
      WORKER_JOB_PERMIT_FETCH_ENABLED: ${WORKER_JOB_PERMIT_FETCH_ENABLED:-true}
      WORKER_JOB_GENERATE_DIY_AI_GUIDE_ENABLED: ${WORKER_JOB_GENERATE_DIY_AI_GUIDE_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/workers:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres-data:
  redis-data:

networks:
  default:
    name: contracttocozy-network
